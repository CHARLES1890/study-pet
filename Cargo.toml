[package]
name = "study-pet"
version = "1.0.0"
description = "A lightweight study companion desktop pet"
authors = ["Study Pet Team"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "study_pet_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "study-pet"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2.0.0"
tauri-plugin-fs = "2.0.0"
tauri-plugin-notification = "2.0.0"
tauri-plugin-opener = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["time", "sync"] }

[profile.release]
opt-level = 3
lto = true
panic = "abort"
strip = true
